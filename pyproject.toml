[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-workflow-engine"
version = "0.2.0"
description = "A sophisticated multi-agent orchestration system using the Google Gemini SDK."
authors = [
    { name = "Er-Kalpesh" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "google-genai>=0.1.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0"
]

[project.scripts]
multi-agent = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
